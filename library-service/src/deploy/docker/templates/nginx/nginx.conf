events {
}

http {
    server {
        listen 80;

        server_name localhost;

        listen 443 ssl;
        ssl_certificate /etc/ssl/server.pem;
        ssl_certificate_key /etc/ssl/server.key;

        location / {
            return 301 $scheme://$http_host/library/;
         }

        location /library/ {
             #upstream
#            proxy_pass http://library-service-application:50801/;
            proxy_pass http://host.docker.internal:50801/;

             #forwarding of suburl, also needs spring framework activation
            proxy_set_header    X-Forwarded-Prefix /library;
         }

     }
}
